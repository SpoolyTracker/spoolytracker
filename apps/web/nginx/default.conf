server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback (F5 sur /inventory)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Optionnel: cache agressif pour assets Vite
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
