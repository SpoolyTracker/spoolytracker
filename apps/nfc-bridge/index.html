<!DOCTYPE html>
<html>

<head>
    <title>SpoolyNFC Bridge</title>
    <style>
        body {
            font-family: sans-serif;
            background: #1a1a1a;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .status {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .connected {
            color: #4ade80;
        }

        .disconnected {
            color: #f87171;
        }

        .log {
            width: 90%;
            height: 150px;
            background: #333;
            overflow-y: auto;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
        }

        .icon {
            font-size: 48px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <img src="icon.png" class="icon" alt="Spooly Icon" style="width: 64px; height: 64px;">

    <div id="status" class="status disconnected">Initializing...</div>
    <div id="log" class="log"></div>

    <script>
        const { ipcRenderer } = require('electron');
        const statusEl = document.getElementById('status');
        const logEl = document.getElementById('log');

        function log(msg) {
            const line = document.createElement('div');
            line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logEl.appendChild(line);
            logEl.scrollTop = logEl.scrollHeight;
        }

        ipcRenderer.on('nfc-event', (event, data) => {
            // Catch-all logger for verification
            if (data.type !== 'log') {
                console.log('Event received:', data);
            }

            if (data.type === 'reader_attached') {
                statusEl.textContent = 'Reader Connected';
                statusEl.className = 'status connected';
                log(`Reader: ${data.name}`);
            } else if (data.type === 'reader_removed') {
                statusEl.textContent = 'Reader Disconnected';
                statusEl.className = 'status disconnected';
                log('Reader removed');
            } else if (data.type === 'tag_read') {
                // Ensure UID is a hex string
                let uidStr = data.uid;
                if (data.uid && typeof data.uid === 'object') {
                    uidStr = Buffer.from(data.uid).toString('hex').toUpperCase();
                }
                log(`Tag Scanned: ${uidStr}`);
            } else if (data.type === 'error') {
                log(`Error: ${data.message}`);
            } else if (data.type === 'log') {
                log(`Debug: ${data.message}`);
            } else {
                log(`Unknown Event: ${JSON.stringify(data)}`);
            }
        });
    </script>
</body>

</html>
