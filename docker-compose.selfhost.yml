services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spooly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.selfhost}
      POSTGRES_DB: ${POSTGRES_DB:-spoolytracker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spooly} -d ${POSTGRES_DB:-spoolytracker}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.selfhost}

  api:
    image: ${API_IMAGE:-ghcr.io/spoolytracker/spoolytracker-api:latest}
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      SELF_HOSTED: "true"
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-spooly}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_DATABASE: ${POSTGRES_DB:-spoolytracker}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.selfhost}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      DASHBOARD_URL: ${FRONTEND_URL:-http://localhost:5173}
      APP_URL: ${FRONTEND_URL:-http://localhost:5173}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      AI_ENGINE_URL: http://ai-engine:8000
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:?Set BOOTSTRAP_ADMIN_USERNAME in .env.selfhost}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?Set BOOTSTRAP_ADMIN_EMAIL in .env.selfhost}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD in .env.selfhost}
      BOOTSTRAP_ORGANIZATION_NAME: ${BOOTSTRAP_ORGANIZATION_NAME:-Self-hosted Organization}
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  ai-engine:
    image: ${AI_ENGINE_IMAGE:-ghcr.io/spoolytracker/spoolytracker-ai-engine:latest}
    restart: unless-stopped
    ports:
      - "${AI_ENGINE_PORT:-8000}:8000"
    environment:
      AI_ENGINE_ENV: ${AI_ENGINE_ENV:-local}
      AI_ENGINE_DEBUG: ${AI_ENGINE_DEBUG:-false}
      AI_ENGINE_MEMORY_DB_PATH: /app/data/ai_engine_memory.sqlite3
      AI_ENGINE_APP_API_URL: http://api:3000
      AI_LLM_PROVIDER: ${AI_LLM_PROVIDER:-none}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_ALLOW_SENSITIVE_LLM_CONTEXT: ${AI_ALLOW_SENSITIVE_LLM_CONTEXT:-false}
      AI_ENGINE_CORS_ORIGINS: ${AI_ENGINE_CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    volumes:
      - ai_engine_data:/app/data
    depends_on:
      - api

  web:
    image: ${WEB_IMAGE:-ghcr.io/spoolytracker/spoolytracker-web:latest}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5173}:80"
    environment:
      SELF_HOSTED: "true"
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:3000}
      AI_ENGINE_PUBLIC_URL: ${AI_ENGINE_PUBLIC_URL:-http://localhost:8000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      FIREBASE_URL: ${FIREBASE_URL:-}
      APPSTORE_URL: ${APPSTORE_URL:-}
      PLAYSTORE_URL: ${PLAYSTORE_URL:-}
      DISCORD_URL: ${DISCORD_URL:-}
    depends_on:
      - api
      - ai-engine

  pgadmin:
    profiles: ["admin"]
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env.selfhost}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
  ai_engine_data:
  uploads:
