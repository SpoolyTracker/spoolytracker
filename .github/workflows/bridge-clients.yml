name: Build Bridge Clients

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "apps/printer-bridge/**"
      - "apps/nfc-bridge/**"
      - ".github/workflows/bridge-clients.yml"
  pull_request:
    paths:
      - "apps/printer-bridge/**"
      - "apps/nfc-bridge/**"
      - ".github/workflows/bridge-clients.yml"
  workflow_dispatch:

jobs:
  windows:
    name: Windows bridge clients
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/printer-bridge/package-lock.json
            apps/nfc-bridge/package-lock.json

      - name: Install NFC bridge dependencies
        working-directory: apps/nfc-bridge
        run: npm ci

      - name: Build NFC bridge console client
        working-directory: apps/nfc-bridge
        run: npm run dist-headless

      - name: Build NFC bridge desktop client
        working-directory: apps/nfc-bridge
        run: npm run dist

      - name: Install printer bridge dependencies
        working-directory: apps/printer-bridge
        run: npm ci

      - name: Build printer bridge console client
        working-directory: apps/printer-bridge
        run: npm run dist-headless

      - name: Build printer bridge desktop client
        working-directory: apps/printer-bridge
        run: npm run dist

      - name: Package artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist-upload -Force | Out-Null
          Compress-Archive -Path apps/nfc-bridge/dist-final/*.exe -DestinationPath dist-upload/spooly-nfc-desktop-windows.zip -Force
          Compress-Archive -Path apps/nfc-bridge/dist-headless/*.exe -DestinationPath dist-upload/spooly-nfc-console-windows.zip -Force
          Compress-Archive -Path apps/printer-bridge/dist-final/*.exe -DestinationPath dist-upload/spooly-printer-desktop-windows.zip -Force
          Compress-Archive -Path apps/printer-bridge/dist-headless/*.exe -DestinationPath dist-upload/spooly-printer-console-windows.zip -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spooly-bridge-clients-windows
          path: dist-upload/*.zip

      - name: Attach artifacts to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-upload/*.zip
